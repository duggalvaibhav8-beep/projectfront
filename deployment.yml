apiVersion: apps/v1
kind: Deployment
metadata:
  name: front-deployment
spec:
  selector:
    matchLabels:
      app: front
  replicas: 3
  template:
    metadata:
      labels:
        app: front
    spec:
      containers:
      - name: front
        image: vaibhavduggal/projectworkfront:latest
        ports:
        - containerPort: 80

